<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #0a0a0b;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 80% 70% at 30% 20%, #000 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 30% 20%, #000 0%, transparent 75%);
    }
    .glow {
      position: absolute;
      width: 820px; height: 820px;
      top: -420px; left: 180px;
      background: radial-gradient(circle, rgba(139,92,246,0.22) 0%, transparent 62%);
      border-radius: 50%;
    }
    .content {
      position: absolute;
      inset: 0;
      padding: 76px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    .brand {
      font-size: 26px; font-weight: 600; letter-spacing: -0.4px; color: #ffffff;
    }
    .brand span { color: #71717a; }
    .pill {
      display: inline-flex; align-items: center; gap: 10px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 19px; color: #a1a1aa;
      margin-bottom: 34px;
      width: fit-content;
    }
    .pill i { width: 9px; height: 9px; border-radius: 50%; background: #34d399; display: block; }
    h1 {
      font-size: 82px; font-weight: 600; line-height: 1.04;
      letter-spacing: -2.6px; color: #ffffff;
    }
    p {
      margin-top: 28px;
      font-size: 27px; line-height: 1.45; color: #a1a1aa;
      max-width: 830px;
    }
    .foot {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 21px; color: #52525b;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 26px;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="content">
    <div class="brand">ayush<span>km</span></div>
    <div>
      <div class="pill"><i></i> Private beta</div>
      <h1>One brief in.<br>A full content run out.</h1>
      <p>AI content automation for lean teams — researched, cited, on-voice drafts with a human approval step before anything ships.</p>
    </div>
    <div class="foot">
      <span>ayushkm.com</span>
      <span>contact@ayushkm.com</span>
    </div>
  </div>
</body>
</html>
